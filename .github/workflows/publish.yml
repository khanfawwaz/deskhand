name: publish
# After the tests pass on main, build the server image and publish it to GitHub's container registry (ghcr.io).
# The home server cannot be reached from the internet, so it comes and gets the new image itself
# (deploy/server/deskhand-pull.sh, on a timer). Nothing in this file touches the server.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false      # let a running publish finish; the next one queues behind it

jobs:
  image:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}      # exactly the commit whose tests passed
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            COMMIT=${{ steps.meta.outputs.short }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/deskhand-server:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/deskhand-server:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
