name: tests
# Runs on every push and pull request. The publish workflow (publish.yml) waits for this one to pass on main.
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]      # the server runs on Linux; the helper is Windows software
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[server,dev]"
      - run: pytest -q --tb=short --junitxml=junit.xml
      - if: failure()
        run: python scripts/ci_annotate.py junit.xml

  web:
    # the React app: types, lint, unit tests, and a production build that must succeed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
