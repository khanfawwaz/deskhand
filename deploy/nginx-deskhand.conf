# Deskhand behind an EXISTING nginx (when nginx already owns ports 80/443 and other sites).
# This is one new, separate site: it does not touch any other server block.
#
#   Same machine:        __PORT__ = 8765    (Deskhand runs on this server)
#   Laptop via tunnel:   __PORT__ = 18765   (Deskhand runs on your laptop and its SSH tunnel opens this port here; see deploy/laptop/README.md)
#
#   sudo sh -c 'sed -e "s/__DOMAIN__/deskhand.example.com/g" -e "s/__PORT__/18765/g" deploy/nginx-deskhand.conf > /etc/nginx/conf.d/deskhand.conf'
#   sudo nginx -t                         # validates ALL of nginx's config; do not continue if it fails
#   sudo systemctl reload nginx           # graceful: existing connections finish normally (no restart)
#   sudo certbot --nginx -d deskhand.example.com     # adds the HTTPS certificate to this site only
#
# To remove it again: delete /etc/nginx/conf.d/deskhand.conf, `sudo nginx -t`, `sudo systemctl reload nginx`.

map $http_upgrade $deskhand_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Everything that needs the admin key stays private: it answers 404 publicly and works only on the server itself.
    # (/usage is the owner's usage and spending view; /v1/usage, the person's own, stays public behind their login.)
    location ~ ^/(admin|pairing|invites|workspaces|clients|devices|tasks|recipes|metrics|usage|estop|docs|redoc)(/|$) { return 404; }
    location = /openapi.json { return 404; }

    # When the laptop is switched off or its tunnel is down, say so plainly instead of showing a bare nginx error.
    error_page 502 503 504 = @deskhand_down;
    location @deskhand_down {
        default_type text/html;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Deskhand</title><body style="font:16px system-ui;max-width:30rem;margin:18vh auto;padding:0 1rem;color:#12241d"><h1 style="font-size:1.4rem">Deskhand is offline for a moment</h1><p>The server is restarting or being updated. Your computers reconnect by themselves. Try again in a minute.</p></body>';
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # replaced, not appended: a visitor cannot forge their address
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;              # the laptop helper keeps a WebSocket open
        proxy_set_header Connection $deskhand_conn_upgrade;
        proxy_buffering off;                                 # live task updates (server-sent events) must not be held back
        proxy_connect_timeout 5s;                            # fail fast when the tunnel is down, so the friendly page shows quickly
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 8m;
    }
}
