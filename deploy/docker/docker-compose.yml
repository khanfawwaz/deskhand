# Deskhand on the home server.  Run from this folder:   docker compose up -d --build
#
#   visitors -> Oracle nginx (https, public address) -> Tailscale -> this machine :8766 -> container :8765
#
# Everything is processed here. The database lives on the big disk (/data/deskhand), not inside the container.
# Secrets live in /data/deskhand/deskhand.env (chmod 600), never in this file.
services:
  deskhand:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: deskhand-server:local
    container_name: deskhand_server
    restart: unless-stopped
    user: "1000:1000"          # the owner of /data/deskhand on the host, so the database file can be written
    env_file: /data/deskhand/deskhand.env
    ports:
      - "8766:8765"            # Oracle reaches it at <this machine's Tailscale address>:8766
    volumes:
      - /data/deskhand:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
